<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hadi August | Counseling, Tutoring & Music</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #3b82f6;
      --text: #f3f4f6;
      --subtext: #9ca3af;
    }
    body {
      margin: 0; padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%; max-width: 480px;
      padding: 2.5rem 1.25rem; box-sizing: border-box;
      text-align: center;
    }
    h1 { margin: 0 0 0.5rem 0; font-size: 1.75rem; font-weight: 700; }
    p.subtitle { margin: 0 0 2rem 0; color: var(--subtext); font-size: 0.95rem; }
    .section-title {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--subtext); margin: 1.75rem 0 0.75rem 0; text-align: left;
    }
    .btn {
      display: block; width: 100%; padding: 1rem; margin-bottom: 0.75rem;
      background-color: var(--card-bg); color: var(--text); text-decoration: none;
      border-radius: 10px; font-weight: 500; font-size: 0.95rem; box-sizing: border-box;
      border: 1px solid #2d2d2d;
    }
    .btn-primary { border-color: var(--accent); color: #60a5fa; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hadi August</h1>
    <p class="subtitle">Psychological Counselor • Educator • Musician</p>

    <div class="section-title">Psychology Services</div>
    <a href="mailto:your-email@example.com?subject=Private%20Counseling%20Inquiry" class="btn btn-primary">Book Private Consultation</a>

    <div class="section-title">Academic & Language Tutoring</div>
    <a href="https://preply.com" target="_blank" rel="noopener" class="btn">Book Lesson on Preply</a>

    <div class="section-title">Music & Creative Releases</div>
    <a href="https://spotify.com" target="_blank" rel="noopener" class="btn">Stream Main Catalog (Spotify / Apple)</a>
    <a href="https://freecords.com" target="_blank" rel="noopener" class="btn">Listen to Beats & Experiments (Freecords)</a>
  </div>
</body>
</html>
